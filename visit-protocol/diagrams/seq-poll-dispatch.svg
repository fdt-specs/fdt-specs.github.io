<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Visit protocol — poll dispatch</title>
  <desc>Sequence diagram of one visit under poll dispatch, for a station that accepts no inbound connection: the station fetches its pending visit descriptors from the Train Handler and acknowledges one; after negotiating and signing the assigner's side it sends the agreement to the Handler in one round trip and receives the assignee's signature in the response; it then runs the train and pushes events and the result envelope to the Handler. Every arrow is opened by the station.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.5"/></marker>
  </defs>
  <style>
    .life { stroke: #777; stroke-dasharray: 5 4; }
    .msg  { stroke: #333; stroke-width: 1.4; marker-end: url(#arrow); }
    .evt  { stroke: #1f6f8b; stroke-width: 1.2; marker-end: url(#arrow-open); }
    .lbl  { fill: #222; } .evl { fill: #1f6f8b; }
    .box  { fill: #f4f6f8; stroke: #333; stroke-width: 1.2; }
    .pep  { fill: #fff8e1; stroke: #b8860b; stroke-width: 1; } .pepl { fill: #7a5a00; font-size: 12px; }
    .note { fill: #fffbe6; stroke: #c9b458; } .small { font-size: 11.5px; fill: #444; }
    .wall { stroke: #b00020; stroke-width: 3; stroke-dasharray: 2 6; }
  </style>

  <rect class="box" x="60" y="20" width="180" height="40" rx="3"/>
  <text class="lbl" x="150" y="45" text-anchor="middle" font-weight="bold">Train Handler</text>
  <rect class="box" x="640" y="20" width="180" height="40" rx="3"/>
  <text class="lbl" x="730" y="45" text-anchor="middle" font-weight="bold">Data Station (no inbound port)</text>
  <line class="life" x1="150" y1="60" x2="150" y2="670"/>
  <line class="life" x1="730" y1="60" x2="730" y2="670"/>
  <line class="wall" x1="600" y1="70" x2="600" y2="670"/>
  <text class="small" x="600" y="686" text-anchor="middle" fill="#b00020">firewall: nothing reaches the station</text>

  <line class="msg" x1="728" y1="100" x2="152" y2="100"/>
  <text class="lbl" x="440" y="94" text-anchor="middle"><tspan font-family="monospace">GET /stations/{station}/pending-visits?wait=…</tspan></text>
  <line class="msg" x1="150" y1="128" x2="728" y2="128"/>
  <text class="lbl" x="440" y="122" text-anchor="middle"><tspan font-family="monospace">200</tspan> · [ visit descriptor, … ]</text>
  <rect class="pep" x="745" y="138" width="190" height="30" rx="3"/>
  <text class="pepl" x="840" y="157" text-anchor="middle">PEP 1 · token, descriptor, digest</text>
  <line class="msg" x1="728" y1="188" x2="152" y2="188"/>
  <text class="lbl" x="440" y="182" text-anchor="middle"><tspan font-family="monospace">POST /visits/{id}/ack</tspan> — event <tspan font-family="monospace">visit.received</tspan> (or a Problem)</text>
  <line class="msg" x1="150" y1="214" x2="728" y2="214"/>
  <text class="lbl" x="440" y="208" text-anchor="middle"><tspan font-family="monospace">204</tspan> (<tspan font-family="monospace">409</tspan> if the Handler withdrew it meanwhile)</text>

  <rect class="pep" x="745" y="226" width="190" height="30" rx="3"/>
  <text class="pepl" x="840" y="245" text-anchor="middle">NEG · request × offers (network)</text>
  <line class="evt" x1="728" y1="275" x2="152" y2="275"/>
  <text class="evl" x="440" y="269" text-anchor="middle"><tspan font-family="monospace">POST …/events</tspan> — <tspan font-family="monospace">negotiation.requested</tspan>, <tspan font-family="monospace">negotiation.matched</tspan></text>
  <rect class="note" x="745" y="287" width="190" height="44" rx="3"/>
  <text class="small" x="840" y="304" text-anchor="middle">derives the agreement, signs the</text>
  <text class="small" x="840" y="320" text-anchor="middle">assigner's side — and makes the call itself</text>

  <line class="msg" x1="728" y1="356" x2="152" y2="356"/>
  <text class="lbl" x="440" y="350" text-anchor="middle"><tspan font-family="monospace">POST /visits/{id}/agreement</tspan> — CountersignatureRequest: agreement, document, assignerSignature</text>
  <rect class="note" x="20" y="366" width="250" height="44" rx="3"/>
  <text class="small" x="145" y="383" text-anchor="middle">verifies the assigner's signature over the</text>
  <text class="small" x="145" y="399" text-anchor="middle">stated digest; signs the assignee's side</text>
  <line class="msg" x1="150" y1="430" x2="728" y2="430"/>
  <text class="lbl" x="440" y="424" text-anchor="middle"><tspan font-family="monospace">201</tspan> · Countersignature (or <tspan font-family="monospace">422</tspan> CountersignatureRefused: UnknownKey | DoesNotVerify | WrongParty | WrongDigest)</text>
  <line class="evt" x1="728" y1="460" x2="152" y2="460"/>
  <text class="evl" x="440" y="454" text-anchor="middle"><tspan font-family="monospace">POST …/events</tspan> — <tspan font-family="monospace">negotiation.active</tspan> (evidence: signatureRoute station-initiated, dispatchMode poll)</text>

  <rect class="pep" x="745" y="474" width="190" height="30" rx="3"/>
  <text class="pepl" x="840" y="493" text-anchor="middle">PEP 2 · EXEC · PEP 3</text>
  <line class="evt" x1="728" y1="524" x2="152" y2="524"/>
  <text class="evl" x="440" y="518" text-anchor="middle"><tspan font-family="monospace">POST …/events</tspan> — <tspan font-family="monospace">visit.queued</tspan> · <tspan font-family="monospace">visit.running</tspan> · <tspan font-family="monospace">visit.inspecting</tspan> · <tspan font-family="monospace">visit.delivered</tspan></text>
  <line class="msg" x1="728" y1="566" x2="152" y2="566"/>
  <text class="lbl" x="440" y="560" text-anchor="middle"><tspan font-family="monospace">PUT /visits/{id}/result</tspan> — visit-result envelope</text>
  <line class="msg" x1="728" y1="604" x2="152" y2="604"/>
  <text class="lbl" x="440" y="598" text-anchor="middle"><tspan font-family="monospace">PUT /visits/{id}/artifacts/{name}</tspan> — released artefacts (digest checked against the envelope)</text>

  <text class="small" x="480" y="650" text-anchor="middle">No <tspan font-family="monospace">negotiation.awaiting-signature</tspan> is emitted in this mode: the station waits for nobody. The stream states the route it took instead.</text>
</svg>
