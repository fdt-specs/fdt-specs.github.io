<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Visit protocol — the states of a visit</title>
  <desc>State diagram of one visit at a station. Non-terminal states: Checking (PEP 1 and negotiation), PendingApproval, Queued (PEP 2 passed), Running (execution), Inspecting (PEP 3). Terminal outcomes: Delivered, Refused, Rejected, TimedOut, Failed, Revoked. Skipped is a seventh outcome a Handler records for a station it never asked; no station state corresponds to it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <style>
    .st { fill: #eef3f8; stroke: #1f6f8b; stroke-width: 1.4; }
    .term { fill: #f6f6f6; stroke: #333; stroke-width: 2; }
    .tl { fill: #222; } .tr { stroke: #333; stroke-width: 1.3; marker-end: url(#arrow); fill: none; }
    .ev { font-size: 11px; fill: #1f6f8b; font-family: monospace; }
    .small { font-size: 11.5px; fill: #444; }
    .good { stroke: #1b7f3b; } .bad { stroke: #b00020; } .grey { stroke: #6d6d6d; }
  </style>

  <!-- start -->
  <circle cx="60" cy="110" r="7" fill="#333"/>
  <line class="tr" x1="67" y1="110" x2="118" y2="110"/>

  <!-- Checking -->
  <rect class="st" x="120" y="80" width="150" height="60" rx="8"/>
  <text class="tl" x="195" y="105" text-anchor="middle" font-weight="bold">Checking</text>
  <text class="small" x="195" y="124" text-anchor="middle">PEP 1 · NEG · signatures</text>

  <!-- PendingApproval -->
  <rect class="st" x="120" y="220" width="150" height="60" rx="8"/>
  <text class="tl" x="195" y="245" text-anchor="middle" font-weight="bold">PendingApproval</text>
  <text class="small" x="195" y="264" text-anchor="middle">a person must decide</text>
  <line class="tr" x1="180" y1="140" x2="180" y2="218"/>
  <text class="ev" x="68" y="183">negotiation.pending-approval</text>
  <line class="tr" x1="212" y1="220" x2="212" y2="142"/>
  <text class="ev" x="218" y="183">granted</text>

  <!-- Queued -->
  <rect class="st" x="360" y="80" width="150" height="60" rx="8"/>
  <text class="tl" x="435" y="105" text-anchor="middle" font-weight="bold">Queued</text>
  <text class="small" x="435" y="124" text-anchor="middle">PEP 2 passed</text>
  <line class="tr" x1="270" y1="110" x2="358" y2="110"/>
  <text class="ev" x="314" y="100" text-anchor="middle">negotiation.active</text>
  <text class="ev" x="314" y="128" text-anchor="middle">visit.queued</text>

  <!-- Running -->
  <rect class="st" x="600" y="80" width="150" height="60" rx="8"/>
  <text class="tl" x="675" y="105" text-anchor="middle" font-weight="bold">Running</text>
  <text class="small" x="675" y="124" text-anchor="middle">EXEC · adapter</text>
  <line class="tr" x1="510" y1="110" x2="598" y2="110"/>
  <text class="ev" x="554" y="100" text-anchor="middle">visit.running</text>

  <!-- Inspecting -->
  <rect class="st" x="600" y="220" width="150" height="60" rx="8"/>
  <text class="tl" x="675" y="245" text-anchor="middle" font-weight="bold">Inspecting</text>
  <text class="small" x="675" y="264" text-anchor="middle">PEP 3 · result inspection</text>
  <line class="tr" x1="675" y1="140" x2="675" y2="218"/>
  <text class="ev" x="684" y="183">visit.inspecting</text>

  <!-- terminals -->
  <rect class="term good" x="780" y="380" width="150" height="46" rx="23"/>
  <text class="tl" x="855" y="408" text-anchor="middle" font-weight="bold">Delivered</text>
  <line class="tr good" x1="700" y1="280" x2="820" y2="378"/>
  <text class="ev" x="792" y="330">visit.delivered</text>

  <rect class="term bad" x="590" y="380" width="150" height="46" rx="23"/>
  <text class="tl" x="665" y="408" text-anchor="middle" font-weight="bold">Rejected</text>
  <text class="small" x="665" y="446" text-anchor="middle">a checkpoint's verdict (PEP 1 · 2 · 3)</text>
  <line class="tr bad" x1="665" y1="280" x2="665" y2="378"/>
  <text class="ev" x="672" y="330">visit.rejected</text>
  <path class="tr bad" d="M195,140 C195,300 300,403 588,403" />
  <path class="tr bad" d="M435,140 C435,330 500,403 588,403" />

  <rect class="term bad" x="30" y="380" width="150" height="46" rx="23"/>
  <text class="tl" x="105" y="408" text-anchor="middle" font-weight="bold">Refused</text>
  <text class="small" x="105" y="446" text-anchor="middle">a controller's decision (NEG)</text>
  <path class="tr bad" d="M150,280 C130,320 110,340 105,378"/>
  <text class="ev" x="20" y="330">negotiation.refused</text>
  <path class="tr bad" d="M140,140 C100,200 90,300 95,378"/>

  <rect class="term grey" x="200" y="380" width="150" height="46" rx="23"/>
  <text class="tl" x="275" y="408" text-anchor="middle" font-weight="bold">TimedOut</text>
  <text class="small" x="275" y="446" text-anchor="middle">nobody decided · Handler cancelled</text>
  <path class="tr grey" d="M230,280 C250,320 265,340 270,378"/>
  <text class="ev" x="200" y="330">negotiation.withdrawn</text>
  <path class="tr grey" d="M650,140 C620,250 420,300 300,378"/>
  <text class="ev" x="470" y="282">visit.cancelled</text>

  <rect class="term bad" x="400" y="380" width="150" height="46" rx="23"/>
  <text class="tl" x="475" y="408" text-anchor="middle" font-weight="bold">Failed</text>
  <text class="small" x="475" y="446" text-anchor="middle">machinery broke (EXEC, or NEG after a grant)</text>
  <path class="tr bad" d="M640,140 C590,250 520,330 480,378"/>
  <text class="ev" x="540" y="318">visit.failed</text>

  <rect class="term bad" x="400" y="490" width="150" height="46" rx="23"/>
  <text class="tl" x="475" y="518" text-anchor="middle" font-weight="bold">Revoked</text>
  <text class="small" x="705" y="518" text-anchor="start">the controller took the agreement out of force while this visit was queued or running (visit.revoked, names the agreement)</text>
  <path class="tr bad" d="M470,140 C470,300 470,420 475,488"/>
  <path class="tr bad" d="M720,140 C760,300 650,470 552,513"/>

  <text class="small" x="480" y="40" text-anchor="middle" font-weight="bold">Seven outcomes, one word each (ADR-026) — the seventh, Skipped, is the Handler's record of a station it never asked, and no station state corresponds to it.</text>
</svg>
