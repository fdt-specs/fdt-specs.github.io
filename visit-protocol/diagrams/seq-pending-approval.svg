<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Visit protocol — a visit that waits for a person</title>
  <desc>Sequence diagram of negotiation when a machine may not decide: the station emits negotiation.pending-approval naming the controller, the rule that requires a person, its recommendation and its own timeout; the Data Controller decides through their own surface; the stream then continues to negotiation.awaiting-signature and negotiation.active on a grant, ends in negotiation.refused on a refusal carrying the controller's words, or — if the Handler's approval wait runs out first — the Handler cancels and the station emits negotiation.withdrawn, outcome TimedOut.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.5"/></marker>
  </defs>
  <style>
    .life { stroke: #777; stroke-dasharray: 5 4; }
    .msg  { stroke: #333; stroke-width: 1.4; marker-end: url(#arrow); }
    .evt  { stroke: #1f6f8b; stroke-width: 1.2; marker-end: url(#arrow-open); }
    .lbl  { fill: #222; } .evl { fill: #1f6f8b; }
    .box  { fill: #f4f6f8; stroke: #333; stroke-width: 1.2; }
    .alt  { fill: none; stroke: #555; stroke-width: 1; }
    .altl { fill: #555; font-size: 11.5px; font-style: italic; }
    .small { font-size: 11.5px; fill: #444; }
    .ref { fill: #b00020; } .ok { fill: #1b7f3b; } .to { fill: #6d6d6d; }
  </style>

  <rect class="box" x="40" y="20" width="160" height="40" rx="3"/>
  <text class="lbl" x="120" y="45" text-anchor="middle" font-weight="bold">Train Handler</text>
  <rect class="box" x="400" y="20" width="160" height="40" rx="3"/>
  <text class="lbl" x="480" y="45" text-anchor="middle" font-weight="bold">Data Station</text>
  <rect class="box" x="760" y="20" width="160" height="40" rx="3"/>
  <text class="lbl" x="840" y="45" text-anchor="middle" font-weight="bold">Data Controller</text>
  <line class="life" x1="120" y1="60" x2="120" y2="620"/>
  <line class="life" x1="480" y1="60" x2="480" y2="620"/>
  <line class="life" x1="840" y1="60" x2="840" y2="620"/>

  <line class="evt" x1="478" y1="100" x2="122" y2="100"/>
  <text class="evl" x="300" y="94" text-anchor="middle">event <tspan font-family="monospace">negotiation.requested</tspan></text>
  <line class="evt" x1="478" y1="140" x2="122" y2="140"/>
  <text class="evl" x="300" y="122" text-anchor="middle">event <tspan font-family="monospace">negotiation.pending-approval</tspan> → PendingApproval</text>
  <text class="small" x="300" y="136" text-anchor="middle">approval: controller, mode, rule, recommendation, expiresAt</text>
  <line class="msg" x1="482" y1="140" x2="838" y2="140"/>
  <text class="lbl" x="660" y="134" text-anchor="middle">the case appears in the controller's queue</text>

  <text class="small" x="300" y="172" text-anchor="middle">the Handler waits up to the plan's <tspan font-family="monospace">approvalWait</tspan>; the station up to <tspan font-family="monospace">approval.expiresAt</tspan></text>

  <!-- alt -->
  <rect class="alt" x="30" y="190" width="900" height="415"/>
  <text class="altl" x="40" y="206">alt</text>

  <!-- granted -->
  <text class="ok" x="60" y="232" font-weight="bold">[ the controller grants ]</text>
  <line class="msg" x1="838" y1="252" x2="482" y2="252"/>
  <text class="lbl" x="660" y="246" text-anchor="middle">decision: grant (reason, authority, digest of what was shown)</text>
  <line class="evt" x1="478" y1="282" x2="122" y2="282"/>
  <text class="evl" x="300" y="276" text-anchor="middle">event <tspan font-family="monospace">negotiation.awaiting-signature</tspan> — the signature exchange follows</text>
  <line class="evt" x1="478" y1="312" x2="122" y2="312"/>
  <text class="evl" x="300" y="306" text-anchor="middle">event <tspan font-family="monospace">negotiation.active</tspan> → the visit proceeds to PEP 2</text>
  <line class="alt" x1="30" y1="330" x2="930" y2="330" stroke-dasharray="6 4"/>

  <!-- refused -->
  <text class="ref" x="60" y="356" font-weight="bold">[ the controller refuses ]</text>
  <line class="msg" x1="838" y1="376" x2="482" y2="376"/>
  <text class="lbl" x="660" y="370" text-anchor="middle">decision: refuse, with their stated reason</text>
  <line class="evt" x1="478" y1="406" x2="122" y2="406"/>
  <text class="evl" x="300" y="400" text-anchor="middle">event <tspan font-family="monospace">negotiation.refused</tspan> → <tspan font-weight="bold">Refused</tspan>, reason verbatim</text>
  <text class="small" x="300" y="422" text-anchor="middle">a governance decision by a named party — never reported as Rejected or Failed</text>
  <line class="alt" x1="30" y1="440" x2="930" y2="440" stroke-dasharray="6 4"/>

  <!-- timed out -->
  <text class="to" x="60" y="466" font-weight="bold">[ approvalWait runs out before anyone decides ]</text>
  <line class="msg" x1="120" y1="490" x2="478" y2="490"/>
  <text class="lbl" x="300" y="484" text-anchor="middle"><tspan font-family="monospace">POST /visits/{id}/cancel</tspan> — cause <tspan font-family="monospace">approval-timeout</tspan></text>
  <line class="evt" x1="478" y1="520" x2="122" y2="520"/>
  <text class="evl" x="300" y="514" text-anchor="middle">event <tspan font-family="monospace">negotiation.withdrawn</tspan> → <tspan font-weight="bold">TimedOut</tspan></text>
  <line class="msg" x1="482" y1="548" x2="838" y2="548"/>
  <text class="lbl" x="660" y="542" text-anchor="middle">the case is withdrawn from the queue — nobody decided</text>
  <text class="small" x="300" y="580" text-anchor="middle">TimedOut is the absence of a decision; attributing it to the controller would put a verdict in the mouth of somebody who gave none</text>
</svg>
